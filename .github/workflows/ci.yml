name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  # Disable tokenizers parallelism warning
  TOKENIZERS_PARALLELISM: false

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-py${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-py${{ matrix.python-version }}-
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        # Ensure langchain-huggingface is installed (should be in pyproject.toml)
        pip install langchain-huggingface

    - name: Test package installation
      run: |
        python -c "from LLMRepoReviewer.repo_reviewer import RepoReviewer; print('✅ Package imports successfully')"
        llm-repo-reviewer --help

    - name: Run unit tests
      run: |
        python run_tests.py unit --verbose

    - name: Run integration tests (mocked LLM)
      run: |
        python run_tests.py integration --verbose

    - name: Run legacy compatibility tests
      run: |
        python -m pytest tests/test_repo_reviewer.py -v

  lint-and-format:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install ruff

    - name: Run ruff linting
      run: |
        ruff check src/ tests/

    - name: Run ruff formatting check
      run: |
        ruff format --check src/ tests/

  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pytest-cov

    - name: Run tests with coverage
      run: |
        python -m pytest tests/test_tools.py tests/test_repo_reviewer_core.py tests/test_integration.py tests/test_repo_reviewer.py \
          --cov=LLMRepoReviewer \
          --cov-report=xml \
          --cov-report=term \
          --cov-report=html

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Upload coverage report as artifact
      uses: actions/upload-artifact@v3
      with:
        name: coverage-report
        path: htmlcov/

  test-installation:
    name: Test Installation Methods
    runs-on: ubuntu-latest
    strategy:
      matrix:
        install-method:
          - "pip install -e ."
          - "pip install ."

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install package using ${{ matrix.install-method }}
      run: |
        python -m pip install --upgrade pip
        ${{ matrix.install-method }}

    - name: Test basic functionality
      run: |
        python -c "
        from LLMRepoReviewer.repo_reviewer import RepoReviewer
        reviewer = RepoReviewer()
        tools = reviewer.list_tools()
        print(f'✅ Available tools: {tools}')
        assert len(tools) >= 3, 'Should have at least 3 tools'
        print('✅ Installation test passed')
        "

    - name: Test CLI functionality
      run: |
        llm-repo-reviewer --help > /dev/null
        echo "✅ CLI help works"
