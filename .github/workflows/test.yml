name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pytest pytest-asyncio
        # Ensure langchain-huggingface is installed (should be in pyproject.toml)
        pip install langchain-huggingface

    - name: Run unit tests
      run: |
        python run_tests.py unit --verbose

    - name: Run integration tests (mocked LLM)
      run: |
        python run_tests.py integration --verbose

    - name: Run legacy tests
      run: |
        python -m pytest tests/test_repo_reviewer.py -v

  test-installation:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"

    - name: Test package installation
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Test CLI help command
      run: |
        llm-repo-reviewer --help

    - name: Test basic import
      run: |
        python -c "from LLMRepoReviewer.repo_reviewer import RepoReviewer; print('✅ Import successful')"
