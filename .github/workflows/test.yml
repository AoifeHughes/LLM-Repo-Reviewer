name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pytest pytest-cov pytest-asyncio
        # Ensure langchain-huggingface is installed (should be in pyproject.toml)
        pip install langchain-huggingface

    - name: Run unit tests
      run: |
        python run_tests.py unit --verbose

    - name: Run integration tests (mocked LLM)
      run: |
        python run_tests.py integration --verbose

    - name: Run legacy tests
      run: |
        python -m pytest tests/test_repo_reviewer.py -v

    - name: Generate coverage report
      run: |
        python -m pytest tests/test_tools.py tests/test_repo_reviewer_core.py tests/test_integration.py tests/test_repo_reviewer.py --cov=LLMRepoReviewer --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install ruff mypy

    - name: Run ruff linting
      run: |
        ruff check src/

    - name: Run ruff formatting check
      run: |
        ruff format --check src/

    - name: Run mypy type checking
      run: |
        mypy src/
      continue-on-error: true  # Don't fail CI on mypy errors for now

  test-installation:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Test package installation
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Test CLI help command
      run: |
        llm-repo-reviewer --help

    - name: Test basic import
      run: |
        python -c "from LLMRepoReviewer.repo_reviewer import RepoReviewer; print('✅ Import successful')"
