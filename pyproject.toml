[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "llm-repo-reviewer"
authors = [
  { name = "Aoife Hughes", email = "aoife1hughes@gmail.com" },
]
description = "AI-powered repository analysis and code review tool"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: BSD License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dynamic = ["version"]
dependencies = [
    "numpy",
    "tqdm",
    "openai",
    "pypdf",
    "transformers",
    "torch",
    "scikit-learn",
    "levenshtein",
    "chromadb",
    "langchain",
    "langchain-community",
    "langchain-huggingface",
    "sentence-transformers",
    "gitpython",
    "jinja2",
    "pyyaml",
    "requests",
]

[project.urls]
Homepage = "https://github.com/aoifehughes/llm-repo-reviewer"
"Bug Tracker" = "https://github.com/aoifehughes/llm-repo-reviewer/issues"
Discussions = "https://github.com/aoifehughes/llm-repo-reviewer/discussions"
Changelog = "https://github.com/aoifehughes/llm-repo-reviewer/releases"
[tool.hatch]
version.path = "src/LLMRepoReviewer/__init__.py"
envs.default.dependencies = [
  "pytest",
  "pytest-cov",
  "pytest-asyncio",
]

[tool.hatch.build.targets.wheel]
packages = ["src/LLMRepoReviewer"]


[tool.pytest.ini_options]
minversion = "6.0"
addopts = ["-ra", "--showlocals", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = [
  "error",
  "ignore:(ast.Str|Attribute s|ast.NameConstant|ast.Num) is deprecated:DeprecationWarning:_pytest",
]
log_cli_level = "INFO"
testpaths = [
  "tests",
]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]


[tool.coverage]
run.source = ["LLMRepoReviewer"]
port.exclude_lines = [
  'pragma: no cover',
  '\.\.\.',
  'if typing.TYPE_CHECKING:',
]

[tool.mypy]
files = ["src"]
python_version = "3.8"
warn_unused_configs = true
strict = true
show_error_codes = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
warn_unreachable = true
disallow_untyped_defs = false
disallow_incomplete_defs = false


[tool.ruff]
line-length = 100  # defaults to 88 like black
target-version = "py38"
src = ["src"]
exclude = []

[tool.ruff.lint]
select = [
  "E", "F", "W", # flake8
  "B",           # flake8-bugbear
  "I",           # isort
  "ARG",         # flake8-unused-arguments
  "C4",          # flake8-comprehensions
  "EM",          # flake8-errmsg
  "ICN",         # flake8-import-conventions
  "ISC",         # flake8-implicit-str-concat
  "G",           # flake8-logging-format
  "PGH",         # pygrep-hooks
  "PIE",         # flake8-pie
  "PL",          # pylint
  "PT",          # flake8-pytest-style
  "PTH",         # flake8-use-pathlib
  "RET",         # flake8-return
  "RUF",         # Ruff-specific
  "SIM",         # flake8-simplify
  "UP",          # pyupgrade
  "YTT",         # flake8-2020
  "EXE",         # flake8-executable
]
extend-ignore = [
  "PLR",    # Design related pylint codes
  "E501",   # Line too long
  "PTH",    # flake8-use-pathlib (temporarily disable for pre-commit)
  "B904",   # Within except clause, raise exceptions with raise ... from
  "EXE001", # Shebang is present but file is not executable
  "PLW1510", # subprocess.run without explicit check argument
  "RUF005", # Consider iterable unpacking instead of concatenation
  "ARG002", # Unused method argument
  "ARG001", # Unused function argument
  "F841",   # Local variable is assigned to but never used
  "PT004",  # Fixture does not return anything, add leading underscore
  "EM101",  # Exception must not use a string literal, assign to variable first
  "PT011",  # pytest.raises is too broad, set the match parameter or use a more specific exception
]
unfixable = [
  "T20",  # Removes print statements
  "F841", # Removes unused variables
]

[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]
"noxfile.py" = ["T20"]

[project.scripts]
llm-repo-reviewer = "LLMRepoReviewer.__main__:main"
